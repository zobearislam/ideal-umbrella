<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Space Pack — Mission Board</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #0a0e17; color: #e0e0e0; font-family: system-ui, sans-serif; padding: 20px; }
    .mission { border: 1px solid #445; padding: 16px; margin: 12px 0; border-radius: 8px; background: #121820; }
    .mission h3 { margin: 0 0 8px; color: #d4af37; }
    .meta { color: #8ab; font-size: 0.9em; }
    .reward { color: #6c6; font-weight: bold; }
    .active { border-color: #6a6; }
    .done { opacity: 0.55; }
    button { background: #c49a45; color: #1a120b; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    nav a { color: #d4af37; margin-right: 16px; }
    #status { margin: 12px 0; color: #9ad17a; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">← Simulator</a>
    <a href="transport.html">Transport</a>
    <a href="galaxy.html">Galaxy</a>
    <a href="ui/company.html">Company</a>
    <a href="ui/diplomacy.html">Diplomacy</a>
  </nav>
  <h1>Mission Board</h1>
  <p>Accept contracts here, gather cargo in the simulator (craft / start inventory), then <strong>Dock</strong> at a station and press <strong>Complete</strong>.</p>
  <div id="status"></div>
  <div id="list"></div>

  <script src="js/core/credits.js"></script>
  <script src="js/core/save-manager.js"></script>
  <script src="js/core/game-state.js"></script>
  <script src="js/data/missions.js"></script>
  <script>
    const list = document.getElementById("list");
    const status = document.getElementById("status");

    function stateInfo() {
      if (!window.GameState) return "";
      const s = window.GameState.getState();
      const active = (s.activeMissions || []).length;
      const done = (s.completedMissionIds || []).length;
      const cr = window.Credits ? window.Credits.getPersonal() : "?";
      return `Active: ${active} · Completed: ${done} · Personal credits: ${Number(cr).toLocaleString()} cr`;
    }

    function render() {
      status.textContent = stateInfo();
      const s = window.GameState ? window.GameState.getState() : { activeMissions: [], completedMissionIds: [] };
      const activeIds = new Set((s.activeMissions || []).map(m => m.id));
      const doneIds = new Set(s.completedMissionIds || []);

      list.innerHTML = (window.MISSIONS || []).map(m => {
        const isActive = activeIds.has(m.id);
        const isDone = doneIds.has(m.id);
        let cls = "mission";
        if (isActive) cls += " active";
        if (isDone) cls += " done";
        let btn = `<button onclick="accept('${m.id}')">Accept</button>`;
        if (isDone) btn = `<button disabled>Completed</button>`;
        else if (isActive) btn = `<button disabled>In progress — dock in simulator to complete</button>`;
        return `
        <div class="${cls}">
          <h3>${m.title} <span class="meta">[${m.type}] Difficulty ${m.difficulty}</span></h3>
          <p>${m.description}</p>
          <p class="meta">${m.from || ""} → ${m.to || ""} ${m.cargo ? `· ${m.quantity} ${m.cargo}` : ""}</p>
          <p class="reward">Reward: ${m.reward.toLocaleString()} cr</p>
          ${btn}
        </div>`;
      }).join("");
    }

    window.accept = id => {
      const m = (window.MISSIONS || []).find(x => x.id === id);
      if (!m) return;
      if (!window.GameState || !window.GameState.acceptMission) {
        alert("GameState not available.");
        return;
      }
      const res = window.GameState.acceptMission(m);
      if (!res.ok) {
        alert(res.error || "Could not accept");
        return;
      }
      alert(`Mission accepted: ${m.title}\n\nNext: open the Simulator, gather any required cargo, Dock at a station, and press Complete.`);
      render();
    };

    render();
  </script>
</body>
</html>
